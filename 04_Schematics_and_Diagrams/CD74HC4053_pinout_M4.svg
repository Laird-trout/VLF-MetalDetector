<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="640" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">CD74HC4053E pinout + your M4 demod wiring</text>
  <text x="410" y="53" text-anchor="middle" font-size="12" fill="#777">Top view, notch/dot up. Pin 1 top-left, count DOWN the left (1-8), UP the right (9-16). Verify against datasheet page 1.</text>

  <!-- chip body -->
  <rect x="330" y="90" width="160" height="440" rx="8" fill="#2b2b2b"/>
  <path d="M390 90 a20 14 0 0 0 40 0" fill="#ffffff"/>
  <circle cx="352" cy="112" r="6" fill="#888"/>
  <text x="410" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#eee">CD74HC4053E</text>
  <text x="410" y="335" text-anchor="middle" font-size="10" fill="#aaa">(notch at top)</text>

  <!-- left pins 1-8 -->
  <g font-size="12.5">
    <rect x="300" y="105" width="30" height="13" fill="#c9a227"/><text x="338" y="116" fill="#fff" font-size="11">1</text>
    <text x="292" y="116" text-anchor="end" font-weight="bold" fill="#1f6fc8">B1 in</text>
    <text x="292" y="130" text-anchor="end" font-size="10" fill="#d33">unused → Vgnd</text>

    <rect x="300" y="160" width="30" height="13" fill="#c9a227"/><text x="338" y="171" fill="#fff" font-size="11">2</text>
    <text x="292" y="171" text-anchor="end" font-weight="bold" fill="#1f6fc8">B0 in</text>
    <text x="292" y="185" text-anchor="end" font-size="10" fill="#d33">unused → Vgnd</text>

    <rect x="300" y="215" width="30" height="13" fill="#c9a227"/><text x="338" y="226" fill="#fff" font-size="11">3</text>
    <text x="292" y="226" text-anchor="end" font-weight="bold" fill="#1f6fc8">C1 in</text>
    <text x="292" y="240" text-anchor="end" font-size="10" fill="#d33">unused → Vgnd</text>

    <rect x="300" y="270" width="30" height="13" fill="#c9a227"/><text x="338" y="281" fill="#fff" font-size="11">4</text>
    <text x="292" y="281" text-anchor="end" font-weight="bold" fill="#1f6fc8">C common</text>
    <text x="292" y="295" text-anchor="end" font-size="10" fill="#d33">unused → Vgnd</text>

    <rect x="300" y="325" width="30" height="13" fill="#c9a227"/><text x="338" y="336" fill="#fff" font-size="11">5</text>
    <text x="292" y="336" text-anchor="end" font-weight="bold" fill="#1f6fc8">C0 in</text>
    <text x="292" y="350" text-anchor="end" font-size="10" fill="#d33">unused → Vgnd</text>

    <rect x="300" y="380" width="30" height="13" fill="#c9a227"/><text x="338" y="391" fill="#fff" font-size="11">6</text>
    <text x="292" y="391" text-anchor="end" font-weight="bold" fill="#1f6fc8">/INH (enable)</text>
    <text x="292" y="405" text-anchor="end" font-size="10" fill="#d33">→ GND rail (always on)</text>

    <rect x="300" y="435" width="30" height="13" fill="#c9a227"/><text x="338" y="446" fill="#fff" font-size="11">7</text>
    <text x="292" y="446" text-anchor="end" font-weight="bold" fill="#1f6fc8">VEE</text>
    <text x="292" y="460" text-anchor="end" font-size="10" fill="#d33">→ GND rail (single supply)</text>

    <rect x="300" y="490" width="30" height="13" fill="#c9a227"/><text x="338" y="501" fill="#fff" font-size="11">8</text>
    <text x="292" y="501" text-anchor="end" font-weight="bold" fill="#1f6fc8">GND</text>
    <text x="292" y="515" text-anchor="end" font-size="10" fill="#d33">→ GND rail</text>
  </g>

  <!-- right pins 16-9 top to bottom -->
  <g font-size="12.5">
    <rect x="490" y="105" width="30" height="13" fill="#c9a227"/><text x="474" y="116" text-anchor="end" fill="#fff" font-size="11">16</text>
    <text x="528" y="116" font-weight="bold" fill="#1f6fc8">VCC</text>
    <text x="528" y="130" font-size="10" fill="#d33">→ 5 V rail + 104 cap → GND, close</text>

    <rect x="490" y="160" width="30" height="13" fill="#c9a227"/><text x="474" y="171" text-anchor="end" fill="#fff" font-size="11">15</text>
    <text x="528" y="171" font-weight="bold" fill="#1f6fc8">B common</text>
    <text x="528" y="185" font-size="10" fill="#d33">unused → Vgnd</text>

    <rect x="490" y="215" width="30" height="13" fill="#c9a227"/><text x="474" y="226" text-anchor="end" fill="#fff" font-size="11">14</text>
    <text x="528" y="226" font-weight="bold" fill="#1f6fc8">A common ★</text>
    <text x="528" y="240" font-size="10" fill="#d33">DEMOD OUT → 10k → 1µF→GND → 10k → 1µF→GND → to A0 divider</text>

    <rect x="490" y="270" width="30" height="13" fill="#c9a227"/><text x="474" y="281" text-anchor="end" fill="#fff" font-size="11">13</text>
    <text x="528" y="281" font-weight="bold" fill="#1f6fc8">A1 in ★</text>
    <text x="528" y="295" font-size="10" fill="#d33">→ Vgnd</text>

    <rect x="490" y="325" width="30" height="13" fill="#c9a227"/><text x="474" y="336" text-anchor="end" fill="#fff" font-size="11">12</text>
    <text x="528" y="336" font-weight="bold" fill="#1f6fc8">A0 in ★</text>
    <text x="528" y="350" font-size="10" fill="#d33">→ PREAMP OUT (OPA2134 pin 1)</text>

    <rect x="490" y="380" width="30" height="13" fill="#c9a227"/><text x="474" y="391" text-anchor="end" fill="#fff" font-size="11">11</text>
    <text x="528" y="391" font-weight="bold" fill="#1f6fc8">Select A ★</text>
    <text x="528" y="405" font-size="10" fill="#d33">→ ESP32 D3 (0° reference)</text>

    <rect x="490" y="435" width="30" height="13" fill="#c9a227"/><text x="474" y="446" text-anchor="end" fill="#fff" font-size="11">10</text>
    <text x="528" y="446" font-weight="bold" fill="#1f6fc8">Select B</text>
    <text x="528" y="460" font-size="10" fill="#d33">unused → GND rail</text>

    <rect x="490" y="490" width="30" height="13" fill="#c9a227"/><text x="474" y="501" text-anchor="end" fill="#fff" font-size="11">9</text>
    <text x="528" y="501" font-weight="bold" fill="#1f6fc8">Select C</text>
    <text x="528" y="515" font-size="10" fill="#d33">unused → GND rail</text>
  </g>

  <!-- footer -->
  <rect x="60" y="550" width="700" height="72" rx="8" fill="#f2f6fc" stroke="#1f6fc8"/>
  <text x="410" y="573" text-anchor="middle" font-size="12" fill="#222">★ = the one switch channel you're using (channel A): D3 flips it, so pin 14 alternates between pin 12 (signal) and pin 13 (Vgnd).</text>
  <text x="410" y="591" text-anchor="middle" font-size="12" fill="#222">Housekeeping rule: unused SELECT pins (9, 10) → GND. Unused ANALOG pins (1, 2, 3, 4, 5, 15) → Vgnd. Nothing floats.</text>
  <text x="410" y="611" text-anchor="middle" font-size="11" fill="#777">Sanity check after seating: GND jumper bottom-left (pin 8), 5 V jumper top-right (pin 16) — diagonal corners or it's in wrong.</text>
</svg>
