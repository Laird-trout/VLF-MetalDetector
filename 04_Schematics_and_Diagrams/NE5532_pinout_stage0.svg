<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">NE5532 pinout + your Stage 0 (Vgnd buffer) wiring</text>
  <text x="380" y="56" text-anchor="middle" font-size="12.5" fill="#777">Top view, chip straddling the breadboard trench. Find the notch/dot — pin 1 is beside it.</text>

  <!-- chip body -->
  <rect x="300" y="110" width="160" height="300" rx="8" fill="#2b2b2b"/>
  <!-- notch -->
  <path d="M360 110 a20 14 0 0 0 40 0" fill="#ffffff"/>
  <circle cx="322" cy="132" r="6" fill="#888"/>
  <text x="380" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#eee">NE5532</text>
  <text x="380" y="290" text-anchor="middle" font-size="10" fill="#aaa">(notch at top)</text>

  <!-- left pins 1-4 -->
  <g font-size="13">
    <rect x="270" y="130" width="30" height="14" fill="#c9a227"/>
    <text x="310" y="142" font-size="12" fill="#fff">1</text>
    <text x="262" y="142" text-anchor="end" font-weight="bold" fill="#1f6fc8">OUT A</text>
    <text x="262" y="157" text-anchor="end" font-size="10.5" fill="#d33">= Vgnd node · jumper to pin 2 · 104 cap → GND</text>

    <rect x="270" y="200" width="30" height="14" fill="#c9a227"/>
    <text x="310" y="212" font-size="12" fill="#fff">2</text>
    <text x="262" y="212" text-anchor="end" font-weight="bold" fill="#1f6fc8">IN A −</text>
    <text x="262" y="227" text-anchor="end" font-size="10.5" fill="#d33">jumper from pin 1 (feedback)</text>

    <rect x="270" y="270" width="30" height="14" fill="#c9a227"/>
    <text x="310" y="282" font-size="12" fill="#fff">3</text>
    <text x="262" y="282" text-anchor="end" font-weight="bold" fill="#1f6fc8">IN A +</text>
    <text x="262" y="297" text-anchor="end" font-size="10.5" fill="#d33">← midpoint of the two 10 kΩ (row M)</text>

    <rect x="270" y="340" width="30" height="14" fill="#c9a227"/>
    <text x="310" y="352" font-size="12" fill="#fff">4</text>
    <text x="262" y="352" text-anchor="end" font-weight="bold" fill="#1f6fc8">V− (GND)</text>
    <text x="262" y="367" text-anchor="end" font-size="10.5" fill="#d33">→ GND rail</text>
  </g>

  <!-- right pins 8-5 top to bottom -->
  <g font-size="13">
    <rect x="460" y="130" width="30" height="14" fill="#c9a227"/>
    <text x="444" y="142" text-anchor="end" font-size="12" fill="#fff">8</text>
    <text x="498" y="142" font-weight="bold" fill="#1f6fc8">V+ (5 V)</text>
    <text x="498" y="157" font-size="10.5" fill="#d33">→ 5 V rail · 104 cap → GND, close</text>

    <rect x="460" y="200" width="30" height="14" fill="#c9a227"/>
    <text x="444" y="212" text-anchor="end" font-size="12" fill="#fff">7</text>
    <text x="498" y="212" font-weight="bold" fill="#1f6fc8">OUT B</text>
    <text x="498" y="227" font-size="10.5" fill="#d33">jumper to pin 6 (parks unused half)</text>

    <rect x="460" y="270" width="30" height="14" fill="#c9a227"/>
    <text x="444" y="282" text-anchor="end" font-size="12" fill="#fff">6</text>
    <text x="498" y="282" font-weight="bold" fill="#1f6fc8">IN B −</text>
    <text x="498" y="297" font-size="10.5" fill="#d33">jumper from pin 7</text>

    <rect x="460" y="340" width="30" height="14" fill="#c9a227"/>
    <text x="444" y="352" text-anchor="end" font-size="12" fill="#fff">5</text>
    <text x="498" y="352" font-weight="bold" fill="#1f6fc8">IN B +</text>
    <text x="498" y="367" font-size="10.5" fill="#d33">→ Vgnd node (pin 1's row)</text>
  </g>

  <!-- footer -->
  <rect x="60" y="430" width="640" height="66" rx="8" fill="#f2f6fc" stroke="#1f6fc8"/>
  <text x="380" y="455" text-anchor="middle" font-size="12.5" fill="#222">Numbering rule for ANY DIP chip: notch/dot at top → pin 1 is top-left, count DOWN the left side (1-4),</text>
  <text x="380" y="473" text-anchor="middle" font-size="12.5" fill="#222">then UP the right side (5-8). Pin 8 always ends up directly across from pin 1.</text>
  <text x="380" y="490" text-anchor="middle" font-size="11" fill="#777">Check with DMM after wiring: pin 1 → GND should read ≈ 2.5 V.</text>
</svg>
